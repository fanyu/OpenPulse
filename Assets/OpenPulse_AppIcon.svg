<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Quiet warm alabaster surface -->
        <linearGradient id="bgAlabaster" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#FCFDFF" />
            <stop offset="52%" stop-color="#F3F6FA" />
            <stop offset="100%" stop-color="#E7ECF3" />
        </linearGradient>

        <!-- Bar 1: Soft cool stone -->
        <linearGradient id="barStone" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#CFD6E0" />
            <stop offset="100%" stop-color="#B8C1CE" />
        </linearGradient>

        <!-- Bars 2 & 4: Deep matte carbon ink -->
        <linearGradient id="barInk" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#282F3D" />
            <stop offset="100%" stop-color="#11151E" />
        </linearGradient>

        <!-- Bar 3: Signature emerald-teal crest -->
        <linearGradient id="barTeal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2DD4BF" />
            <stop offset="55%" stop-color="#14B8A6" />
            <stop offset="100%" stop-color="#0D9488" />
        </linearGradient>

        <!-- Subtle top specular rim -->
        <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>

        <!-- Soft tactile elevation shadow (portable SVG filter primitives) -->
        <filter id="barShadow" x="-15%" y="-10%" width="130%" height="125%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur" />
            <feOffset in="blur" dx="0" dy="14" result="offsetBlur" />
            <feFlood flood-color="#0F172A" flood-opacity="0.13" result="shadowColor" />
            <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
            <feMerge>
                <feMergeNode in="shadow" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Full-bleed alabaster backdrop -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgAlabaster)" />

    <!-- Sculptural 4-bar pulse cadence -->
    <g filter="url(#barShadow)">
        <rect x="184" y="420" width="128" height="248" rx="64" fill="url(#barStone)" />
        <rect x="360" y="288" width="128" height="456" rx="64" fill="url(#barInk)" />
        <rect x="536" y="196" width="128" height="632" rx="64" fill="url(#barTeal)" />
        <rect x="712" y="342" width="128" height="356" rx="64" fill="url(#barInk)" />
    </g>

    <!-- Delicate top-edge studio sheen -->
    <rect x="185.5" y="421.5" width="125" height="245" rx="62.5" fill="none" stroke="url(#topSheen)" stroke-width="3" />
    <rect x="361.5" y="289.5" width="125" height="453" rx="62.5" fill="none" stroke="url(#topSheen)" stroke-width="3" />
    <rect x="537.5" y="197.5" width="125" height="629" rx="62.5" fill="none" stroke="url(#topSheen)" stroke-width="3" />
    <rect x="713.5" y="343.5" width="125" height="353" rx="62.5" fill="none" stroke="url(#topSheen)" stroke-width="3" />
</svg>
